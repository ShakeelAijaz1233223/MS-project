# ============================================================================
# UltraDownloader Production Nginx Configuration (HTTPS / TLS 1.3 + HTTP->HTTPS)
# - Redirects port 80 HTTP traffic to HTTPS (443)
# - Sets trusted X-Forwarded-For / X-Forwarded-Proto headers from Nginx only
# - Supports unbuffered SSE live-card feed & HTTP 206 Range media downloads
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ultradownloader.pro www.ultradownloader.pro;

    # ACME Let's Encrypt HTTP-01 challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ultradownloader.pro www.ultradownloader.pro;

    # Replace with your real Let's Encrypt / TLS certificate paths on VPS
    ssl_certificate     /etc/letsencrypt/live/ultradownloader.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultradownloader.pro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    # Hardened HTTP Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Production SPA Static Assets
    root /var/www/ultradownloader/frontend/dist;
    index index.html;

    # Static immutable hashed assets cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker must never be stale-cached
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # CRITICAL: Unbuffered Real-Time Server-Sent Events (SSE) for Admin Live Notification Feed
    location /api/v1/admin/live-cards/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Streaming HTTP 206 Partial Content Range Proxy & Resumable Downloads (IDM / FDM / Browsers)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:4000/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
